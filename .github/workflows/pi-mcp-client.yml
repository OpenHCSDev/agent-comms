name: Pi MCP client

on:
  pull_request:
    paths:
      - "extensions/pi-mcp-client/**"
      - ".github/workflows/pi-mcp-client.yml"
  push:
    branches: [main]
    paths:
      - "extensions/pi-mcp-client/**"
      - ".github/workflows/pi-mcp-client.yml"
  workflow_dispatch:

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: extensions/pi-mcp-client/package-lock.json
      - name: Install pinned Pi and MCP SDK without lifecycle scripts
        working-directory: extensions/pi-mcp-client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise actual Pi RPC, dual trust, MCP fixture and headless policy without a provider
        working-directory: extensions/pi-mcp-client
        run: npm test
      - name: Check patch formatting
        run: git diff --check origin/main...HEAD

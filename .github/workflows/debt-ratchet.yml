name: Merge queue

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  ratchet:
    name: debt-${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install agent-comms
        run: python -m pip install -e .

      - name: No new structural debt against the base
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          PYTHONPATH=src:tools python tools/debt_ratchet.py \
            --root ${{ matrix.kind }} --base "$BASE" --head HEAD

name: Debt ratchet

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: debt-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debt-ratchet:
    name: Debt ratchet and surface guards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare touched production files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/debt_ratchet.py --base "$PR_BASE" --head "$PR_HEAD"
      - name: Install guard dependencies
        run: python -m pip install --disable-pip-version-check -e '.[all]' pytest pytest-asyncio
      - name: Run every marked surface guard
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -p pytest_asyncio.plugin -o addopts='' --strict-markers -m refactor_guard -q

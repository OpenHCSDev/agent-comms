name: Merge queue

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Materialization merges and tree proofs create Git objects; every child inherits this
# process-only identity/signing policy. No global or shared repository config is written.
env:
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_COMMITTER_NAME: ${{ github.actor }}
  GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: commit.gpgsign
  GIT_CONFIG_VALUE_0: "false"

# A superseded push to a pull request stops its old run; queue groups never share a group.
# The draft state is part of the key: a draft run skips every job but the ratchets, so one that
# starts in the same second as ready_for_review must not cancel the ready run (#3164 and #3154 lost
# every check).
concurrency:
  group: merge-queue-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash .github/run-step.sh {0}

jobs:
  # Drafts cannot merge, so they hold no runner for the slow jobs, which need this one. The
  # ratchets run on drafts too: units hold drafts for hours, and a merge from main that left a
  # name undefined (#3107, partial at cli_protocol.py:177) went unseen until someone ran one.
  ready:
    if: github.event_name == 'merge_group' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: true
        shell: bash

  # The base every job measures from, drafts included. A pull request checks out its merge into
  # current main, so the base is that merge's first parent; pull_request.base.sha is main when the
  # PR was opened, and measuring from it charges the PR with everything main merged since.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: base
        shell: bash
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: echo "base=${QUEUE_BASE:-$(git rev-parse HEAD^1)}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [ready, base]
    if: github.event_name == 'merge_group' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Bootstrap only Core and locked checker dependencies
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/checker-venv" uv sync --locked --all-extras
          echo "$RUNNER_TEMP/checker-venv/bin" >> "$GITHUB_PATH"
      - name: Resolve the actual tested source tuple once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/paired-sources"
      - name: Build the one common checker environment
        run: PYTHONPATH=src:tools python tools/checker_stack.py --ci-inputs "$RUNNER_TEMP/paired-sources"
      - name: Compile production and tools
        run: python -m compileall -q src tools
      - name: Import every Core and hook module
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          for package_name in ("agent_comms", "agent_comms_hooks"):
              package = importlib.import_module(package_name)
              for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
                  if module.name.rsplit(".", 1)[-1] != "__main__":
                      importlib.import_module(module.name)
          PY
      - name: Collect the test suite
        run: pytest --collect-only -q -p no:cacheprovider
      - name: The native pin matches the tree
        run: pytest tests/test_native_pin.py --noconftest --no-cov -q -p no:cacheprovider
      # The installed runtime answers every probe but a TargetProbe with its own installer, so the tree
      # this change merges onto must declare every one of them with the same fields.
      - name: Stack clients import only names Core has; the outgoing wire matches the base
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: PYTHONPATH=src:tools python tools/module_layers.py --check --base "$BASE" --ci-inputs "$RUNNER_TEMP/paired-sources" --report "$GITHUB_STEP_SUMMARY"
      - name: The same sources are still current before success
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --revalidate-ci-inputs "$RUNNER_TEMP/paired-sources"

  native-scripts:
    name: native-scripts
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install Core
        run: python -m pip install -e src/agent_comms/skills/refactor-audit -e .
      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native
      - name: Run every native script
        run: |
          export PI_NATIVE_PACKAGE_DIR="$(python -c 'from agent_comms.native_package import pinned_native_package; print(pinned_native_package())')"
          for script in stack/test-*; do
            printf '\nRunning %s\n' "$script"
            "$script" || { status=$?; printf 'FAILED: %s (exit %s)\n' "$script" "$status" >&2; exit "$status"; }
          done

  install-rehearsal:
    name: install-rehearsal
    needs: [ready, base]
    if: github.event_name == 'merge_group' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REHEARSALS: >-
        tests/test_install_rehearsal.py
        tests/test_native_input_bus_path.py
        tests/test_install.py::test_install_routes_a_new_bus_and_replaces_only_a_route_that_selects_none
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # The rehearsal installs the package and runs its own tests; a change to neither
      # (tools, guards, docs) cannot change what it observes.
      - name: Whether the change reaches the installed package or the rehearsals
        id: reach
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: |
          read -ra rehearsals <<< "$REHEARSALS"
          git diff --quiet "$BASE" HEAD -- src pyproject.toml uv.lock "${rehearsals[@]%%::*}" \
            && echo "reaches=false" >> "$GITHUB_OUTPUT" || echo "reaches=true" >> "$GITHUB_OUTPUT"
      - if: steps.reach.outputs.reaches == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install uv
        if: steps.reach.outputs.reaches == 'true'
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
      - name: Install non-editable Core and test dependencies
        if: steps.reach.outputs.reaches == 'true'
        run: python -m pip install -e src/agent_comms/skills/refactor-audit '.[dev]'
      - name: Build the installer's private runtime and rehearse through its CLI
        if: steps.reach.outputs.reaches == 'true'
        run: python -m agent_comms.installer.test_runtime $REHEARSALS

  review-verdict:
    name: review-verdict
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install the native source-input reader
        run: python -m pip install -e src/agent_comms/skills/refactor-audit -e .
      # The PR check proves a separate combined carrier and exact reviewed members.
      # The queue additionally requires the root's explicit promotion at this head.
      # A hand gh auto-merge request cannot turn source acceptance into that permission.
      - name: Only the captured combined carrier may merge
        run: PYTHONPATH=src python -m agent_comms.integration --check-merge-inputs "$RUNNER_TEMP/merge-inputs"

  ratchet:
    name: debt-${{ matrix.kind }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Bootstrap only Core and locked checker dependencies
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/checker-venv" uv sync --locked --all-extras
          echo "$RUNNER_TEMP/checker-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve the actual tested source tuple once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/paired-sources"

      - name: Build the one common checker environment
        run: PYTHONPATH=src:tools python tools/checker_stack.py --ci-inputs "$RUNNER_TEMP/paired-sources"

      # Saved by debt-ratchet-cache.yml on main; entries are keyed by content, so any
      # older main's cache only misses where the code differs.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/agent-comms
          key: debt-ratchet-${{ matrix.kind }}-${{ needs.base.outputs.base }}
          restore-keys: debt-ratchet-${{ matrix.kind }}-

      - name: No new structural debt against the base
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: |
          set -o pipefail
          ratchet_status=0
          PYTHONPATH=src:tools python tools/debt_ratchet.py \
            --root ${{ matrix.kind }} --base "$BASE" --head HEAD --ci-inputs "$RUNNER_TEMP/paired-sources" 2>ratchet-findings.txt | tee ratchet.txt || ratchet_status=$?
          cat ratchet-findings.txt >&2
          exit "$ratchet_status"

      - name: The same sources are still current before success
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --revalidate-ci-inputs "$RUNNER_TEMP/paired-sources"

      # Hosted annotations stop at ten per step, so a unit never saw a long list (88 findings
      # on the bus batch, 2026-10-21). The whole list goes on the pull request, one comment per
      # kind, replaced on every run.
      - name: The whole finding list on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          KIND: debt-${{ matrix.kind }}
        run: |
          marker="<!-- $KIND findings -->"
          { echo "$marker"; echo "**$KIND** at $(git rev-parse --short HEAD), every finding:"; echo '```';
            cat ratchet-findings.txt; echo '```'; } > body.md
          old=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$old" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$old" -F body=@body.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md
          fi

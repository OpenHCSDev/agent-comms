name: Merge queue

on:
  merge_group:
    types: [checks_requested]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-${{ github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  ratchet:
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    name: debt-${{ matrix.kind }}
    runs-on: [self-hosted, Linux, X64, ts-gaming, agent-comms-merge]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - name: Check the exact GitHub run through the restricted host entrypoint
        env:
          RUN_ID: ${{ github.run_id }}
          CHECK_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$AGENT_COMMS_GATE_KEY" "$AGENT_COMMS_GATE_ENDPOINT" "$RUN_ID $CHECK_KIND"

  practice-install:
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    name: install-rehearsal
    runs-on: [self-hosted, Linux, X64, ts-gaming, agent-comms-merge]
    timeout-minutes: 60
    steps:
      - name: Practice install; private buses and logs never enter the runner sandbox
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$AGENT_COMMS_GATE_KEY" "$AGENT_COMMS_GATE_ENDPOINT" "$RUN_ID install"

  enqueue-approved:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    needs: [ratchet, practice-install]
    runs-on: [self-hosted, Linux, X64, ts-gaming, agent-comms-merge]
    timeout-minutes: 5
    steps:
      - name: Enter GitHub's queue after approval and successful checks
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$AGENT_COMMS_GATE_KEY" "$AGENT_COMMS_GATE_ENDPOINT" "$RUN_ID enqueue"

name: Merge queue

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

defaults:
  run:
    shell: bash .github/run-step.sh {0}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install agent-comms and test dependencies
        run: python -m pip install -e src/agent_comms/skills/refactor-audit -e '.[dev]'
      - name: Compile production and tools
        run: python -m compileall -q src tools
      - name: Import every Core and hook module
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          for package_name in ("agent_comms", "agent_comms_hooks"):
              package = importlib.import_module(package_name)
              for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
                  if module.name.rsplit(".", 1)[-1] != "__main__":
                      importlib.import_module(module.name)
          PY
      - name: Collect the test suite
        run: pytest --collect-only -q -p no:cacheprovider
      - name: The native pin matches the tree
        run: pytest tests/test_native_pin.py --noconftest --no-cov -q -p no:cacheprovider
      - name: Stack clients import only modules Core has
        run: python tools/module_layers.py --check

  native-scripts:
    name: native-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install Core
        run: python -m pip install -e src/agent_comms/skills/refactor-audit -e .
      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native
      - name: Run every native script
        run: |
          export PI_NATIVE_PACKAGE_DIR="$(python -c 'from agent_comms.native_package import pinned_native_package; print(pinned_native_package())')"
          for script in stack/test-*; do
            printf '\nRunning %s\n' "$script"
            "$script" || { status=$?; printf 'FAILED: %s (exit %s)\n' "$script" "$status" >&2; exit "$status"; }
          done

  install-rehearsal:
    name: install-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Install non-editable Core and test dependencies
        run: python -m pip install -e src/agent_comms/skills/refactor-audit '.[dev]'
      - name: Build the installer's private runtime and rehearse through its CLI
        run: python -m agent_comms.installer.test_runtime tests/test_install_rehearsal.py tests/test_native_input_bus_path.py

  review-verdict:
    name: review-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      QUEUE_REF: ${{ github.event.merge_group.head_ref }}
    steps:
      # A pull request is pushed before its verdict exists; the queue's group
      # is where the commander's verdict on the head must already be success.
      - name: The commander's verdict on the queued head is success
        if: github.event_name == 'merge_group'
        shell: bash
        run: |
          [[ $QUEUE_REF =~ /pr-([0-9]+)- ]]
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" --jq .head.sha)
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" \
            --jq '[.statuses[] | select(.context == "agent-comms/review")][0].state // "none"')
          echo "PR #${BASH_REMATCH[1]} head $head: agent-comms/review=$verdict"
          [[ $verdict == success ]]

  ratchet:
    name: debt-${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install agent-comms
        run: python -m pip install -e '.[dev]'

      - name: No new structural debt against the base
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          PYTHONPATH=src:tools python tools/debt_ratchet.py \
            --root ${{ matrix.kind }} --base "$BASE" --head HEAD 2>&1 | tee ratchet.txt

      # Hosted annotations stop at ten per step, so a unit never saw a long list (88 findings
      # on the bus batch, 2026-10-21). The whole list goes on the pull request, one comment per
      # kind, replaced on every run.
      - name: The whole finding list on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          KIND: debt-${{ matrix.kind }}
        run: |
          marker="<!-- $KIND findings -->"
          { echo "$marker"; echo "**$KIND** at $(git rev-parse --short HEAD), every finding:"; echo '```';
            grep -E '^(introduced|grew) ' ratchet.txt; echo '```'; } > body.md
          old=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$old" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$old" -F body=@body.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md
          fi

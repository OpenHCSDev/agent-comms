name: Debt ratchet

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: debt-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debt-ratchet:
    name: Debt ratchet and surface guards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install packaged ratchet and guard dependencies
        run: python -m pip install --disable-pip-version-check '.[all]' pytest pytest-asyncio
      - name: Compare touched production files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
        run: agent-comms-ratchet --root src/agent_comms --base "$PR_BASE" --head "$PR_HEAD"
      - name: Run every marked surface guard
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -p pytest_asyncio.plugin -o addopts='' --strict-markers -m refactor_guard -q

name: Merge queue

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Materialization merges and tree proofs create Git objects; every child inherits this
# process-only identity/signing policy. No global or shared repository config is written.
env:
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_COMMITTER_NAME: ${{ github.actor }}
  GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: commit.gpgsign
  GIT_CONFIG_VALUE_0: "false"

# A superseded push to a pull request stops its old run; queue groups never share a group.
# The draft state is part of the key: a draft run skips every job but the NRA gate, so one that
# starts in the same second as ready_for_review must not cancel the ready run (#3164 and #3154 lost
# every check).
concurrency:
  group: merge-queue-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.draft && 'draft' || 'ready') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash .github/run-step.sh {0}

jobs:
  # Drafts cannot merge, so they hold no runner for the slow jobs, which need this one. The
  # the NRA gate runs on drafts too: units hold drafts for hours, and a merge from main that left a
  # name undefined (#3107, partial at cli_protocol.py:177) went unseen until someone ran one.
  ready:
    if: github.event_name == 'merge_group' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: true
        shell: bash

  # The native event/source reader owns both the comparison base and combined-job selection.
  # Ordinary sources still get diagnostics; naming a branch batch/ grants nothing.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      base: ${{ steps.sources.outputs.base }}
      combined: ${{ steps.sources.outputs.combined }}
      tested: ${{ steps.sources.outputs.tested }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install the native source-input reader
        run: python -m pip install -e .
      - name: Derive job selection from the actual tested sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/job-sources" --workflow-output "$GITHUB_OUTPUT"
      # The head's tested sources stay pending until the `tested` job sees every job green.
      - name: This head's tested sources are pending
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED: ${{ steps.sources.outputs.tested }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending \
            -f context=agent-comms/tested -f "description=$TESTED" > /dev/null
      # When main has not moved, the queue commit tests exactly the sources (each repository's
      # baseline and tree) its pull request's green run already tested: the measuring jobs then
      # report success without measuring again. Anything else, or any failed lookup, measures.
      - name: Whether a green pull-request run already tested these sources
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          TESTED: ${{ steps.sources.outputs.tested }}
        run: |
          reused=false
          recorded=none
          if [[ $GITHUB_EVENT_NAME == merge_group && $QUEUE_REF =~ /pr-([0-9]+)- ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" --jq .head.sha) || head=""
            if [[ -n $head ]]; then
              recorded=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" --jq \
                '[.statuses[] | select(.context == "agent-comms/tested")][0] // {} | "\(.state) \(.description)"') || recorded=none
            fi
            [[ $recorded == "success $TESTED" ]] && reused=true
          fi
          echo "this run tests $TESTED; the pull request's run recorded: $recorded; reused=$reused"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [ready, base]
    if: needs.base.outputs.combined == 'true' && needs.base.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Bootstrap only Core and locked checker dependencies
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/checker-venv" uv sync --locked --all-extras
          echo "$RUNNER_TEMP/checker-venv/bin" >> "$GITHUB_PATH"
      - name: Resolve the actual tested source tuple once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/paired-sources"
      - name: Build the one common checker environment
        run: PYTHONPATH=src:tools python tools/checker_stack.py --ci-inputs "$RUNNER_TEMP/paired-sources"
      - name: Compile production and tools
        run: python -m compileall -q src tools
      - name: Import every Core and hook module
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          for package_name in ("agent_comms", "agent_comms_hooks"):
              package = importlib.import_module(package_name)
              for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
                  if module.name.rsplit(".", 1)[-1] != "__main__":
                      importlib.import_module(module.name)
          PY
      - name: Collect the test suite
        run: pytest --collect-only -q -p no:cacheprovider
      - name: The native pin matches the tree
        run: pytest tests/test_native_pin.py --noconftest --no-cov -q -p no:cacheprovider
      # The installed runtime answers every probe but a TargetProbe with its own installer, so the tree
      # this change merges onto must declare every one of them with the same fields.
      - name: Stack clients import only names Core has; the outgoing wire matches the base
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: PYTHONPATH=src:tools python tools/module_layers.py --check --base "$BASE" --ci-inputs "$RUNNER_TEMP/paired-sources" --report "$GITHUB_STEP_SUMMARY"
      - name: The same sources are still current before success
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --revalidate-ci-inputs "$RUNNER_TEMP/paired-sources"

  native-scripts:
    name: native-scripts
    needs: [ready, base]
    if: needs.base.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install Core
        run: python -m pip install -e .
      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native
      - name: Run every native script
        run: |
          export PI_NATIVE_PACKAGE_DIR="$(python -c 'from agent_comms.native_package import pinned_native_package; print(pinned_native_package())')"
          for script in stack/test-*; do
            printf '\nRunning %s\n' "$script"
            "$script" || { status=$?; printf 'FAILED: %s (exit %s)\n' "$script" "$status" >&2; exit "$status"; }
          done

  install-rehearsal:
    name: install-rehearsal
    needs: [ready, base]
    if: needs.base.outputs.combined == 'true' && needs.base.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REHEARSALS: >-
        tests/test_install_rehearsal.py
        tests/test_native_input_bus_path.py
        tests/test_install.py::test_install_routes_a_new_bus_and_replaces_only_a_route_that_selects_none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The rehearsal installs the package and runs its own tests; a change to neither
      # (tools, guards, docs) cannot change what it observes.
      - name: Whether the change reaches the installed package or the rehearsals
        id: reach
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: |
          read -ra rehearsals <<< "$REHEARSALS"
          git diff --quiet "$BASE" HEAD -- src pyproject.toml uv.lock "${rehearsals[@]%%::*}" \
            && echo "reaches=false" >> "$GITHUB_OUTPUT" || echo "reaches=true" >> "$GITHUB_OUTPUT"
      - if: steps.reach.outputs.reaches == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install uv
        if: steps.reach.outputs.reaches == 'true'
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
      - name: Install non-editable Core and test dependencies
        if: steps.reach.outputs.reaches == 'true'
        run: python -m pip install '.[dev]'
      - name: Build the installer's private runtime and rehearse through its CLI
        if: steps.reach.outputs.reaches == 'true'
        run: python -m agent_comms.installer.test_runtime $REHEARSALS

  review-verdict:
    name: review-verdict
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install the native source-input reader
        run: python -m pip install -e .
      # A combined carrier proves its exact reviewed members and, in the queue, its promotion.
      # An ordinary source owes only its own head's verdict, read by the next step.
      - name: A captured combined carrier proves its members
        run: PYTHONPATH=src python -m agent_comms.integration --check-merge-inputs "$RUNNER_TEMP/merge-inputs"
      # A verdict names the pull request head, not the merge group's own commit.
      - name: The commander's verdict on the queued head is success
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          [[ $QUEUE_REF =~ /pr-([0-9]+)- ]]
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" --jq .head.sha)
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" \
            --jq '[.statuses[] | select(.context == "agent-comms/review")][0].state // "none"')
          echo "PR #${BASH_REMATCH[1]} head $head: agent-comms/review=$verdict"
          [[ $verdict == success ]]
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success \
            -f context=agent-comms/review -f "description=Verdict on head $head"

  nra-gate:
    name: debt-${{ matrix.kind }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      # A root's debt can only grow when the change reaches it: its own files, Core it imports,
      # or the locked checker. A combined carrier also changes its paired sources. No job-level
      # `if` here: a skipped matrix job never expands, so its required debt-src/debt-tools
      # checks would never report. A reused queue entry skips inside each leg instead.
      matrix:
        include:
          - kind: src
            reaches: src pyproject.toml uv.lock
          - kind: tools
            reaches: tools src pyproject.toml uv.lock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whether the change reaches this root
        id: reach
        env:
          BASE: ${{ needs.base.outputs.base }}
          COMBINED: ${{ needs.base.outputs.combined }}
          REUSED: ${{ needs.base.outputs.reused }}
          REACHES: ${{ matrix.reaches }}
        run: |
          read -ra paths <<< "$REACHES"
          if [[ $REUSED == true ]]; then
            echo "reaches=false" >> "$GITHUB_OUTPUT"
          elif [[ $COMBINED == true ]] || ! git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            echo "reaches=true" >> "$GITHUB_OUTPUT"
          else
            echo "reaches=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.reach.outputs.reaches == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Bootstrap only Core and locked checker dependencies
        if: steps.reach.outputs.reaches == 'true'
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/checker-venv" uv sync --locked --all-extras
          echo "$RUNNER_TEMP/checker-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve the actual tested source tuple once
        if: steps.reach.outputs.reaches == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/paired-sources"

      - name: Build the one common checker environment
        if: steps.reach.outputs.reaches == 'true'
        run: PYTHONPATH=src:tools python tools/checker_stack.py --ci-inputs "$RUNNER_TEMP/paired-sources"

      # Saved by nra-gate-cache.yml on main; entries are keyed by content, so any
      # older main's cache only misses where the code differs.
      - if: steps.reach.outputs.reaches == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/agent-comms
          key: nra-gate-${{ matrix.kind }}-${{ needs.base.outputs.base }}
          restore-keys: nra-gate-${{ matrix.kind }}-

      - name: No new structural debt against the base
        id: gate
        if: steps.reach.outputs.reaches == 'true'
        env:
          BASE: ${{ needs.base.outputs.base }}
        run: |
          set -o pipefail
          gate_status=0
          PYTHONPATH=src:tools python tools/nra_gate.py \
            --ci-inputs "$RUNNER_TEMP/paired-sources" \
            --root ${{ matrix.kind }} --base "$BASE" --head HEAD 2>gate-findings.txt | tee gate.txt || gate_status=$?
          cat gate-findings.txt >&2
          exit "$gate_status"

      - name: The same sources are still current before success
        if: steps.reach.outputs.reaches == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --revalidate-ci-inputs "$RUNNER_TEMP/paired-sources"

      # The whole verdict on the pull request, one comment per kind; the action owns its shape.
      - name: The gate's findings on the pull request
        if: always() && github.event_name == 'pull_request' && contains(fromJSON('["success","failure"]'), steps.gate.outcome)
        uses: ./.github/actions/nra-findings
        with:
          findings: gate-findings.txt
          kind: debt-${{ matrix.kind }}
          outcome: ${{ steps.gate.outcome }}

  # Every job green on this head records its tested sources, which a queue entry with the same
  # sources reuses instead of measuring again. A required job that did not run records failure.
  tested:
    name: tested
    needs: [base, smoke, native-scripts, install-rehearsal, review-verdict, nra-gate]
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Record whether every job passed on these tested sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED: ${{ needs.base.outputs.tested }}
          MEASURED: ${{ needs.base.result }} ${{ needs.native-scripts.result }} ${{ needs.review-verdict.result }} ${{ needs.nra-gate.result }}
          OPTIONAL: ${{ needs.smoke.result }} ${{ needs.install-rehearsal.result }}
        run: |
          state=success
          for result in $MEASURED; do [[ $result == success ]] || state=failure; done
          for result in $OPTIONAL; do [[ $result == success || $result == skipped ]] || state=failure; done
          echo "measured: $MEASURED; optional: $OPTIONAL; agent-comms/tested=$state"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=$state \
            -f context=agent-comms/tested -f "description=$TESTED" > /dev/null

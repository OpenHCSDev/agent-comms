name: diag
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: python -m pip install -q -e src/agent_comms/skills/refactor-audit -e '.[dev]' mypy
      - name: run diag.sh and push its output to diag-out/<branch>
        shell: bash
        run: |
          set +e
          bash diag.sh > /tmp/out.txt 2>&1
          echo "exit $?" >> /tmp/out.txt
          git config user.name diag && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan out && git rm -rq --cached . && cp /tmp/out.txt out.txt
          git add out.txt && git commit -qm out && git push -qf origin "HEAD:refs/heads/diag-out/${GITHUB_REF_NAME#diag/}"

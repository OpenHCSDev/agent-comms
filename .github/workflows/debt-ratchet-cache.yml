name: Debt ratchet cache

# A pull request restores only caches saved on its own ref or on main, and the merge queue runs
# never run on main, so every ratchet measured main cold. Measuring each main commit against its
# parent saves main's readings and mypy analysis for every pull request based on it.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# GitHub's actor supplies only Git object attribution, never merge permission.
# Process-scoped configuration reaches merge/commit-tree without changing any checkout.
env:
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_COMMITTER_NAME: ${{ github.actor }}
  GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: commit.gpgsign
  GIT_CONFIG_VALUE_0: "false"

concurrency:
  group: debt-ratchet-cache
  cancel-in-progress: true

jobs:
  warm:
    name: cache-${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Bootstrap only Core and locked checker dependencies
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/checker-venv" uv sync --locked --all-extras
          echo "$RUNNER_TEMP/checker-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve main's actual merged source tuple once
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --resolve-ci-inputs "$RUNNER_TEMP/paired-sources"

      - name: Build the one common checker environment
        run: PYTHONPATH=src:tools python tools/checker_stack.py --ci-inputs "$RUNNER_TEMP/paired-sources"

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/agent-comms
          key: debt-ratchet-${{ matrix.kind }}-${{ github.sha }}
          restore-keys: debt-ratchet-${{ matrix.kind }}-

      # The verdict belongs to the merge queue; this run only fills the cache.
      - name: Measure main against its parent
        run: |
          PYTHONPATH=src:tools python tools/debt_ratchet.py \
            --root ${{ matrix.kind }} --base HEAD^1 --head HEAD --ci-inputs "$RUNNER_TEMP/paired-sources" || true

      - name: The same sources are still current before saving cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m agent_comms.integration --revalidate-ci-inputs "$RUNNER_TEMP/paired-sources"

      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/agent-comms
          key: debt-ratchet-${{ matrix.kind }}-${{ github.sha }}

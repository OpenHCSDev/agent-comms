name: Debt ratchet cache

# A pull request restores only caches saved on its own ref or on main, and the merge queue runs
# never run on main, so every ratchet measured main cold. Measuring each main commit against its
# parent saves main's readings and mypy analysis for every pull request based on it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debt-ratchet-cache
  cancel-in-progress: true

jobs:
  warm:
    name: cache-${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [src, tools]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install agent-comms
        run: |
          python -m pip install packaging
          python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/agent-comms
          key: debt-ratchet-${{ matrix.kind }}-${{ github.sha }}
          restore-keys: debt-ratchet-${{ matrix.kind }}-

      # The verdict belongs to the merge queue; this run only fills the cache.
      - name: Measure main against its parent
        run: |
          PYTHONPATH=src:tools python tools/debt_ratchet.py \
            --root ${{ matrix.kind }} --base HEAD^1 --head HEAD || true

      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/agent-comms
          key: debt-ratchet-${{ matrix.kind }}-${{ github.sha }}

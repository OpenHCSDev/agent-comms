name: CI

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: stack/pyproject.toml

      - name: Install uv
        run: python -m pip install uv==0.12.0

      - name: Install the stack at the latest Toad, Textual and ui-theme mains
        run: |
          uv lock --project stack --upgrade --python "$(command -v python)"
          uv sync --project stack --locked --python "$(command -v python)"

      - name: Check installed clients
        run: |
          stack/.venv/bin/python -c "import agent_comms.acp, textual, toad.app"
          stack/.venv/bin/agent-comms --help
          stack/.venv/bin/toad --help

      - name: Setup Node for pinned native Pi
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      # prepare-pi-native installs the MCP client's locked dependencies with
      # `npm ci --offline` so preparation never fetches. Fill the npm cache from
      # the same lockfile first; the prepared copy is still built offline.
      - name: Cache locked MCP client dependencies
        working-directory: extensions/pi-mcp-client
        run: npm ci --ignore-scripts --omit=dev --omit=peer --no-audit --no-fund

      - name: Build and check native compaction without a provider
        run: |
          stack/bin/prepare-pi-native
          package=$(ls -d stack/.pi-native-*/node_modules/@earendil-works/pi-coding-agent)
          for mode in threshold overflow manual; do
            PI_COMPACTION_TEST_PACKAGE="$PWD/$package" node stack/test-native-pi-compaction.mjs "$mode"
          done

      - name: Check native RPC compaction against localhost provider
        run: |
          uv pip install --python stack/.venv/bin/python pytest pytest-asyncio pytest-cov 'pytest-xdist>=3.6' 'pytest-timeout>=2.3'
          PYTHONPATH="$PWD/src" AC_NATIVE_STACK_BIN="$PWD/stack/bin/pi-native" \
            stack/.venv/bin/python -m pytest tests/test_stack_native_compaction.py tests/test_stack_send_now.py --no-cov -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The saved-session loopback tests need Pi's published, byte-checked
      # executable. They never use credentials or an external model endpoint.
      - name: Setup Node for pinned Pi loopback fixture
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install pinned Pi loopback fixture
        shell: bash
        run: |
          npm install -g --prefix "$HOME/.local/pi-npm" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1

      - name: Install locked MCP SDK fixture dependencies
        working-directory: extensions/pi-mcp-client
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The durable host imports pi-durable, pi-ai and chord from beside it.
      - name: Install locked runtime host dependencies
        working-directory: src/agent_comms
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      # Tests of the native runtime read the pinned package from stack/. The
      # locked install above fills the npm cache that preparation reads offline.
      # Preparation runs agent_comms under the stack environment, never this job's python.
      - name: Prepare pinned native Pi
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install uv==0.12.0
          uv lock --project stack --upgrade --python "$(command -v python)"
          uv sync --project stack --locked --python "$(command -v python)"
          stack/bin/prepare-pi-native

      - name: Run tests with coverage (85% enforced on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-report=xml --cov-report=term-missing -v

      # Sealed /var/tmp, /proc and SO_PEERCRED fixtures run only on Linux.
      # Keep macOS test execution, but do not enforce Linux coverage there.
      - name: Run tests (coverage reported, Linux-only fixtures skipped)
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-fail-under=0 --cov-report=xml --cov-report=term-missing -v

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

name: CI

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage (85% enforced on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-report=xml --cov-report=term-missing -v

      # Sealed /var/tmp, /proc and SO_PEERCRED fixtures run only on Linux.
      # Keep Mac/Windows test execution, but do not enforce Linux coverage there.
      - name: Run tests (coverage reported, Linux-only fixtures skipped)
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-fail-under=0 --cov-report=xml --cov-report=term-missing -v

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black formatting check
        run: |
          black --check src tests

      - name: Ruff lint check
        run: |
          ruff check src tests

      - name: Mypy type check
        run: |
          mypy src

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

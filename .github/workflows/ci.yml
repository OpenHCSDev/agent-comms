name: CI

on:
  # A push to main runs the whole suite. The queue's checks only collect it, so this run
  # is what shows main red; the concurrency block below says which commits get one.
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# One running suite per ref and one pending run on its newest commit. Each suite is a full
# matrix: a group per commit ran one per merge in parallel, and on 2026-11-05 six of them held
# every hosted runner while the merge queue sat 30 minutes without one. A merge skipped this
# way is covered by the next run; a red is bisected between the two.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AC_NATIVE_STACK_BIN: ${{ github.workspace }}/stack/bin/pi-native

defaults:
  run:
    shell: bash .github/run-step.sh {0}

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install the stack at the latest Toad, Textual and ui-theme mains
        uses: ./.github/actions/install-stack

      - name: Check installed clients
        run: |
          stack/.venv/bin/python -c "import agent_comms.execution.acp, textual, toad.app"
          stack/.venv/bin/agent-comms --help
          stack/.venv/bin/toad --help

      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native
        with:
          python: ${{ github.workspace }}/stack/.venv/bin/python

      - name: Check native RPC compaction against localhost provider
        run: |
          PYTHONPATH="$PWD/src" \
            stack/.venv/bin/python -m pytest tests/test_stack_native_compaction.py tests/test_stack_persistent_compaction.py --no-cov -q

      # Opt-in until now, so MCP calls in native turns came back UNKNOWN for three weeks unseen.
      - name: Check native Pi MCP tool calls over ACP against a localhost provider
        run: |
          PYTHONPATH="$PWD/src" AC_MCP_NATIVE_BIN="$AC_NATIVE_STACK_BIN" \
            stack/.venv/bin/python -m pytest tests/test_mcp_acceptance.py --no-cov -q -o faulthandler_timeout=60

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      # The installer and its carries run under the stack, Toad included; so do the tests.
      - name: Install the stack
        uses: ./.github/actions/install-stack

      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native

      - name: Check the native pin matches the tree
        run: pytest tests/test_native_pin.py --no-cov -q

      # The saved-session loopback tests need Pi's published, byte-checked
      # executable. They never use credentials or an external model endpoint.

      - name: Install pinned Pi loopback fixture
        run: |
          npm install -g --prefix "$HOME/.local/pi-npm" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1

      # The durable host imports pi-durable, pi-ai and chord from beside it.
      - name: Install locked runtime host dependencies
        working-directory: src/agent_comms
        shell: bash
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run tests with coverage (85% enforced)
        run: |
          pytest -n auto --maxprocesses=8 --dist=worksteal --cov=agent_comms --cov-report=xml --cov-report=term-missing -v

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

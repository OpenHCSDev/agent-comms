name: CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        run: python -m pip install uv==0.12.0

      - name: Install the stack at the latest Toad, Textual and ui-theme mains
        run: |
          uv lock --project stack --upgrade --python "$(command -v python)"
          uv sync --project stack --locked --python "$(command -v python)"

      - name: Check installed clients
        run: |
          stack/.venv/bin/python -c "import agent_comms.acp, textual, toad.app"
          stack/.venv/bin/agent-comms --help
          stack/.venv/bin/toad --help

      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native
        with:
          python: ${{ github.workspace }}/stack/.venv/bin/python

      - name: Build and check native compaction without a provider
        run: |
          package=$(ls -d stack/.pi-native-*/node_modules/@earendil-works/pi-coding-agent)
          for mode in threshold overflow manual; do
            PI_COMPACTION_TEST_PACKAGE="$PWD/$package" node stack/test-native-pi-compaction.mjs "$mode"
          done

      - name: Check native RPC compaction against localhost provider
        run: |
          uv pip install --python stack/.venv/bin/python pytest pytest-asyncio pytest-cov 'pytest-xdist>=3.6' 'pytest-timeout>=2.3'
          PYTHONPATH="$PWD/src" AC_NATIVE_STACK_BIN="$PWD/stack/bin/pi-native" \
            stack/.venv/bin/python -m pytest tests/test_stack_native_compaction.py tests/test_stack_persistent_compaction.py --no-cov -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e src/agent_comms/skills/refactor-audit -e ".[dev]"

      - name: Prepare pinned native Pi
        uses: ./.github/actions/prepare-native

      - name: Check the native pin matches the tree
        run: pytest tests/test_native_pin.py --no-cov -q

      # The saved-session loopback tests need Pi's published, byte-checked
      # executable. They never use credentials or an external model endpoint.

      - name: Install pinned Pi loopback fixture
        shell: bash
        run: |
          npm install -g --prefix "$HOME/.local/pi-npm" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1

      # The durable host imports pi-durable, pi-ai and chord from beside it.
      - name: Install locked runtime host dependencies
        working-directory: src/agent_comms
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run tests with coverage (85% enforced on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-report=xml --cov-report=term-missing -v

      # Sealed /var/tmp, /proc and SO_PEERCRED fixtures run only on Linux.
      # Keep macOS test execution, but do not enforce Linux coverage there.
      - name: Run tests (coverage reported, Linux-only fixtures skipped)
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-fail-under=0 --cov-report=xml --cov-report=term-missing -v

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

name: CI

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv==0.12.0

      - name: Install pinned stack
        run: uv sync --project stack --locked --python 3.14

      - name: Check installed clients
        run: |
          stack/.venv/bin/python -c "import agent_comms, textual, toad"
          stack/.venv/bin/agent-comms --help
          stack/.venv/bin/toad --help

      - name: Setup Node for pinned native Pi
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Build and check native compaction without a provider
        run: |
          npm install -g --prefix "$HOME/.local/pi-npm" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1
          stack/bin/prepare-pi-native
          node stack/test-native-compaction.mjs

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The saved-session loopback tests need Pi's published, byte-checked
      # executable. They never use credentials or an external model endpoint.
      - name: Setup Node for pinned Pi loopback fixture
        if: matrix.os != 'windows-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install pinned Pi loopback fixture
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          npm install -g --prefix "$HOME/.local/pi-npm" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1

      - name: Run tests with coverage (85% enforced on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-report=xml --cov-report=term-missing -v

      # Sealed /var/tmp, /proc and SO_PEERCRED fixtures run only on Linux.
      # Keep Mac/Windows test execution, but do not enforce Linux coverage there.
      - name: Run tests (coverage reported, Linux-only fixtures skipped)
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest --cov=agent_comms --cov-fail-under=0 --cov-report=xml --cov-report=term-missing -v

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black formatting check
        run: |
          black --check src tests

      - name: Ruff lint check
        run: |
          ruff check src tests

      - name: Mypy type check
        run: |
          mypy src

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

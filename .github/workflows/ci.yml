name: CI
on:
  workflow_dispatch:
jobs:
  concurrency:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3ee1c3d8f87e7e3df81fb8354b727cf57975404
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run only the failed test on unchanged source
        run: python -m pytest tests/test_concurrency.py::TestConcurrentWire::test_concurrent_senders_preserve_every_message_and_sequence --no-cov -vv

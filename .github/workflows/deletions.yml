name: Deletions

# Direct pushes and admin merges skip every pull-request gate; each commit they bring
# names the definitions it deletes, or main goes red here. This is its own workflow so CI's
# concurrency group never touches it: CI replaces a pending run with the newest one, and
# a replaced run's commits never reached this check. On 2026-11-06 that hid three unnamed
# deletions in #4172 and #4175. A check that takes one second has no runner to save.
on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash .github/run-step.sh {0}

jobs:
  deletions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Every deleted definition is named in its commit
        run: python tools/deleted_definitions.py "${{ github.event.before }}" "${{ github.sha }}"

name: Prepare install rehearsal dependencies
description: Install Core and share content-addressed downloads and wheels with private runtime builds.
outputs:
  cache-hit:
    description: Whether the dependency cache already exists on an accessible ref.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version-file: pyproject.toml
    - name: Use one uv cache across private homes
      shell: bash .github/run-step.sh {0}
      run: echo "UV_CACHE_DIR=$RUNNER_TEMP/rehearsal-uv-cache" >> "$GITHUB_ENV"
    - name: Restore dependency downloads and wheels
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.UV_CACHE_DIR }}
          ~/.cache/pip
        key: install-rehearsal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Install declared uv
      shell: bash .github/run-step.sh {0}
      run: |
        python -m pip install packaging
        python -m pip install "$(python -I src/agent_comms/installer/declared_uv.py pyproject.toml)"
    - name: Install non-editable Core and test dependencies
      shell: bash .github/run-step.sh {0}
      run: uv pip install --system -e src/agent_comms/skills/refactor-audit '.[dev]'

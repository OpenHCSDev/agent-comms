name: Prepare pinned native Pi
description: Warm the locked MCP cache, then prepare the native tree with offline extension installation.
inputs:
  python:
    description: Installed Core interpreter command or executable path
    required: false
    default: python
  core:
    description: Where Core is checked out; Toad's suite checks it out beside its own tree
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22.19.0"
    - name: Warm locked MCP dependencies
      shell: bash
      working-directory: ${{ inputs.core }}/extensions/pi-mcp-client
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Prepare pinned native Pi
      shell: bash
      run: ${{ inputs.core }}/stack/native/prepare-pi-native --python "$(command -v '${{ inputs.python }}')"

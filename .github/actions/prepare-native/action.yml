name: Prepare pinned native Pi
description: Warm the locked MCP cache, then prepare the native tree with offline extension installation.
inputs:
  python:
    description: Installed Core interpreter command or executable path
    required: false
    default: python
  host-dependencies:
    description: Also install the locked runtime host packages Core's durable host imports from beside it (src/agent_comms)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22.19.0"
    - name: Warm locked MCP dependencies
      shell: bash
      working-directory: extensions/pi-mcp-client
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Prepare pinned native Pi
      shell: bash
      run: stack/bin/prepare-pi-native --python "$(command -v '${{ inputs.python }}')"
    - name: Install locked runtime host dependencies
      if: inputs.host-dependencies == 'true'
      shell: bash
      working-directory: src/agent_comms
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Pinned local agent-comms, Toad, and Textual runtime"
requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false
# This stack owns the paired core and framework pins, including Toad's requirements.
override-dependencies = ["agent-comms[acp]", "textual[syntax]==8.2.8"]

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "47f9856b6762553ca10ef94e26de85b2ba069c0d" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "b8bda1ba592451763414b16d35a67f41bc6429e9" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "e4a9154826dd5f96125a7cf75060af47ce39c544" }

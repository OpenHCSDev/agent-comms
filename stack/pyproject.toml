[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Pinned local agent-comms, Toad, and Textual runtime"
requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false
# This stack owns the paired core and framework pins, including Toad's requirements.
override-dependencies = ["agent-comms[acp]", "textual[syntax]==8.2.8"]

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "12bd75cac244df15e7f89290da0694a16a092353" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "3031869cd23a6845b64cc35dd11a0a2e9a033260" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "1738abd8e3524b7e86171b70256d7f7e52fdb724" }

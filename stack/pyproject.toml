[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Pinned local agent-comms, Toad, and Textual runtime"
requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false
# This stack owns the paired core and framework pins, including Toad's requirements.
override-dependencies = ["agent-comms[acp]", "textual[syntax]==8.2.8"]

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "dfbfbf070330f834f92f6668581f0a89b906b2dd" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "3512e505819f7ca97bb746f079ec6b7d93688eb9" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "609b74bf3d7851bd2c1eff61dc2790e86e1925af" }

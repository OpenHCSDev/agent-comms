[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Main-checkout agent-comms with main-branch UI packages"
requires-python = ">=3.14,<3.15"
dependencies = [
    # The test interpreter installs this stack, so our own packages resolve here and nowhere
    # else. It used to sync the checkout's own lock, which nothing refreshed, so it kept
    # installing a NominalRefactorAdvisor old enough that its gate.py and json_reports.py
    # disagreed with each other while this stack tracked that package's main.
    #
    # The tools belong in this list and not in an extra: `package = false` makes this a
    # virtual project, whose own optional-dependencies `uv sync --all-extras` does not
    # select, so an extra locks the tools and installs none of them. That is exactly how the
    # shared test interpreter lost pytest-asyncio, pytest-timeout and pytest-xdist.
    "agent-comms[dev]",
    "batrachian-toad",
    "textual[syntax]",
]

[tool.uv]
package = false
# This stack owns source selection, including Toad's transitive requirements.
override-dependencies = [
    # The extra travels with the override or it does not travel: an override replaces the
    # whole requirement, so plain "agent-comms" here silently strips [dev] from the
    # dependency above and the test interpreter locks its tools without installing them.
    "agent-comms[dev]",
    "formbridge",
    "metaclass-registry",
    "nominal-refactor-advisor",
    "python-introspect",
    "textual[syntax]",
    "ui-theme",
]

[tool.uv.sources]
agent-comms = { path = "..", editable = true }
formbridge = { git = "https://github.com/OpenHCSDev/formbridge.git", branch = "main" }
metaclass-registry = { git = "https://github.com/OpenHCSDev/metaclass-registry", branch = "main" }
nominal-refactor-advisor = { git = "https://github.com/OpenHCSDev/NominalRefactorAdvisor", branch = "main" }
python-introspect = { git = "https://github.com/OpenHCSDev/python-introspect", branch = "main" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", branch = "main" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", branch = "main" }
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", branch = "main" }

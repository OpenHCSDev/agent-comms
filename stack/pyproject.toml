requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "f2cfdfe49233b9fcf92dc55c5501ffaddd01bfc6" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "e622526e476c4fc5e89088cbc77d88881610babf" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "1552bfdba6aa79d80e53cd88c01884148125dba6" }

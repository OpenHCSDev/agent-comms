[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Pinned local agent-comms, Toad, and Textual runtime"
requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false
# This stack owns its core pin, including Toad's transitive requirement.
override-dependencies = ["agent-comms[acp]"]

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "b407c18c888872228ef0d4b2a2d6a80f4a40ef0d" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "43e57c91e9643cfab053630e1d5aaadd12cffad9" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "16ede007c34bec893b2dbedb3999223381129678" }

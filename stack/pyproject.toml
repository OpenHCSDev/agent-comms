[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Pinned local agent-comms, Toad, and Textual runtime"
requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false
# This stack owns the paired core and framework pins, including Toad's requirements.
override-dependencies = [
    "agent-comms[acp]",
    "textual[syntax]==8.2.8",
    "ui-theme @ git+https://github.com/OpenHCSDev/ui-theme.git@93920bcf07c355482bdccbcb1067537f56481d06",
]

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "88f4e6ee115ba817118ffcc0b52e5579eb7763e5" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "501421fec4eb888caf918f1a01b017b969d97a0e" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "b69cc8e34eeb7d84f9b4d33afd3c18538ac74ae9" }

requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "054028b5c7cc3a36c964d1abbfd78af60c13545e" }

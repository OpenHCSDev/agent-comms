[project]
name = "agent-comms-stack"
version = "0.1.0"
description = "Main-checkout agent-comms with main-branch UI packages"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "agent-comms",
    "batrachian-toad",
    "textual[syntax]",
]

[tool.uv]
package = false
# This stack owns source selection, including Toad's transitive requirements.
override-dependencies = [
    "agent-comms",
    "formbridge",
    "metaclass-registry",
    "textual[syntax]",
    "ui-theme",
]

[tool.uv.sources]
agent-comms = { path = "..", editable = true }
formbridge = { git = "https://github.com/OpenHCSDev/formbridge.git", rev = "b67c97e5c3ad1eda5c06a464fdc578038d01e3e8" }
metaclass-registry = { git = "https://github.com/OpenHCSDev/metaclass-registry", rev = "60138d533ef0758c5f093d9110ba9f5656f0934a" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "5a52b4841d0d2ed27224b8b940f7323cb66a8be5" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "7c62867cce97d2b0c521c869750413132a315a77" }
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", rev = "ba614bcb90b38c1f70789059a3c6aef8c017971b" }

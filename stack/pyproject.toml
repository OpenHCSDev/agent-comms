dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "8f2ed0c3674c29f142ec49c8ebce631652f1fcbd" }

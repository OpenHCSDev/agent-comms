requires-python = ">=3.14"
dependencies = [
    "agent-comms[acp]",
    "batrachian-toad==0.6.20",
    "textual[syntax]==8.2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "48f2ee626a6b7cdbdd849b55d581ecd19aa3f40c" }
batrachian-toad = { git = "https://github.com/OpenHCSDev/toad.git", rev = "f3f161e8a8158f740147690ada299550a9ece1d5" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "4fa6a9c440eaaa7dfaad45a33af146fc4b7e922e" }

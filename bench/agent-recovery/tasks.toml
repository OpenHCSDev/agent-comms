# Each task is a frozen snapshot of a codebase after a long baseline-agent run,
# plus a goal whose metric is measured by a command, not by the agent's report.

[[task]]
id = "comms-reply-latency"
repo = "https://github.com/OpenHCSDev/agent-comms"
snapshot = "5d8185a8"   # main before the first Claude session (2026-10-09)
goal = """
A one-line reply in a channel takes 23-26 s end to end on the live root.
Reduce channel reply latency (human send -> first reply visible) without
changing delivery semantics. Report measured before/after numbers.
"""
# Not yet automated: needs a live agent-comms root. Contract: print {"value": seconds}
# for a one-line channel reply (human send -> first reply visible). Empty = skipped.
metric = ""
metric_better = "lower"
tests = "python -m pytest -q -x --timeout=300 tests"

[[task]]
id = "toad-frame-time"
repo = "https://github.com/OpenHCSDev/toad"
snapshot = "179faf54"   # main before the first Claude session (2026-10-09)
goal = """
Every frame, including opening a tab and scrolling a long history, should
render in 16 ms or less. Reduce worst-frame time in the scroll scenario
without changing what the reader sees. Report measured before/after numbers.
"""
# Not yet automated: needs an X display and a saved comms session. Contract: print
# {"value": worst_frame_ms} for the scroll scenario. Empty = skipped.
metric = ""
metric_better = "lower"
tests = "python -m pytest -q -x --timeout=300 tests"

[[arm]]
id = "codex-gpt-6-astra"
command = "codex exec --model gpt-6-astra --dangerously-bypass-approvals-and-sandbox"

[[arm]]
id = "codex-gpt-6.1-sol"
command = "codex exec --model gpt-6.1-sol --dangerously-bypass-approvals-and-sandbox"

[[arm]]
id = "codex-gpt-5.6-sol"
command = "codex exec --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox"

[[arm]]
id = "claude-opus-5.5"
command = "claude -p --model claude-opus-5-5 --dangerously-skip-permissions"

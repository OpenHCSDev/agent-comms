[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-comms"
dynamic = ["version"]
description = "Declaration-owned multi-agent coordination for OpenHCS: threads, JSONL message bus, shared ledger, and ACP server"
authors = [{ name = "Tristan Simas", email = "tristan.simas@mail.mcgill.ca" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
keywords = ["agents", "coordination", "message-bus", "acp", "multi-agent"]

dependencies = [
    "aiohttp>=3.14",
    "agent-client-protocol>=0.8",
    "metaclass-registry>=0.4.0",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "nominal-refactor-audit @ git+https://github.com/OpenHCSDev/NominalRefactorAdvisor.git@120c04fb9a0eb4afafab6d621d1c5fd421bb7552#subdirectory=skills/refactor-audit",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "black==26.5.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[project.urls]
Homepage = "https://github.com/OpenHCSDev/agent-comms"
Repository = "https://github.com/OpenHCSDev/agent-comms"
Issues = "https://github.com/OpenHCSDev/agent-comms/issues"

[project.scripts]
agent-comms = "agent_comms.cli:main"
agent-comms-acp = "agent_comms.acp:main"
agent-comms-agent = "agent_comms.worker:main"
agent-comms-nk-foreground = "agent_comms.nk_foreground:main"
pi-comms-native = "agent_comms.native_pi:main"
agent-comms-claude-bridge = "agent_comms.cli_bridges.claude:main"
agent-comms-codex-bridge = "agent_comms.cli_bridges.codex:main"
agent-comms-opencode-bridge = "agent_comms.cli_bridges.opencode:main"
agent-comms-commander = "agent_comms.commander.cli:main"
agent-comms-watch-guard = "agent_comms_watch:main"
agent-comms-connector = "agent_comms.connector:main"
opencode-comms = "agent_comms.cli_bridges.opencode_launch:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_comms", "src/agent_comms_watch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
".pi/APPEND_SYSTEM.md" = "agent_comms/_native/APPEND_SYSTEM.md"
"stack/pi-native.sha256" = "agent_comms/_native/pi-native.sha256"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "extensions", "README.md", "LICENSE", "hatch_build.py",
    ".pi/APPEND_SYSTEM.md", "stack/APPEND_SYSTEM.md",
    "stack/pi-native.sha256",
]

[tool.hatch.version]
path = "src/agent_comms/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-n auto --maxprocesses=8 --dist=worksteal --cov=agent_comms --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
# A hung test fails by name instead of holding the whole job.
timeout = 60
markers = ["refactor_guard: permanent architecture guards selected by the required debt check"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["agent_comms.store_files.ExclusiveLock"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-comms"
dynamic = ["version"]
description = "Declaration-owned multi-agent coordination for OpenHCS: threads, JSONL message bus, shared ledger, and ACP server"
authors = [{ name = "Tristan Simas", email = "tristan.simas@mail.mcgill.ca" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
keywords = ["agents", "coordination", "message-bus", "acp", "multi-agent"]

dependencies = [
    "aiohttp>=3.14",
    "agent-client-protocol>=0.8",
    "immutables",
    "metaclass-registry @ git+https://github.com/OpenHCSDev/metaclass-registry@main",
    "nominal-refactor-advisor @ git+https://github.com/OpenHCSDev/NominalRefactorAdvisor@main",
    "packaging>=24",
    "pydantic>=2.13",
    "pytest>=7.0",
    "python-introspect @ git+https://github.com/OpenHCSDev/python-introspect@main",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "black==26.5.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "uv==0.13.1",
    "tomli-w==1.2.0",
]

[project.urls]
Homepage = "https://github.com/OpenHCSDev/agent-comms"
Repository = "https://github.com/OpenHCSDev/agent-comms"
Issues = "https://github.com/OpenHCSDev/agent-comms/issues"

[project.scripts]
agent-comms = "agent_comms.cli:main"
agent-comms-acp = "agent_comms.execution.acp:main"
agent-comms-agent = "agent_comms.execution.worker:main"
agent-comms-nk-foreground = "agent_comms.execution.nk_foreground:main"
pi-comms-native = "agent_comms.execution.native_pi:main"
agent-comms-claude-bridge = "agent_comms.cli_bridges.claude:main"
agent-comms-inbox-watch = "agent_comms.cli_bridges.inbox_watch_client:main"
agent-comms-cloud-session = "agent_comms.cli_bridges.cloud_session:main"
agent-comms-codex-bridge = "agent_comms.cli_bridges.codex:main"
agent-comms-opencode-bridge = "agent_comms.cli_bridges.opencode:main"
agent-comms-team = "agent_comms.team.cli:main"
agent-comms-integrate = "agent_comms.projects.integration:main"
agent-comms-team-skill = "agent_comms_hooks.watch:SkillText.main"
agent-comms-team-reread = "agent_comms_hooks.reread:ReminderProgram.main"
agent-comms-prime = "agent_comms.cli_bridges.hook_prime:main"
agent-comms-team-deferral-guard = "agent_comms_hooks.deferral:DeferralGuard.main"
agent-comms-team-bounded-waits = "agent_comms_hooks.bounded_waits:BoundedWaits.main"
agent-comms-read-gate = "agent_comms_hooks.read_gate:ReadGateProgram.main"
agent-comms-hooks = "agent_comms_hooks.hook_switch:main"
agent-comms-queue-bypass-guard = "agent_comms_hooks.queue_bypass:QueueBypassGuard.main"
agent-comms-claude-session-started = "agent_comms.cli_bridges.hook_session:SessionHook.main"
agent-comms-claude-session-ended = "agent_comms_hooks.session:SessionEnded.main"
agent-comms-claude-subagent-started = "agent_comms_hooks.forks:SubagentStartProgram.main"
agent-comms-claude-subagent-stopped = "agent_comms_hooks.forks:SubagentStopProgram.main"
agent-comms-connector = "agent_comms.transport.connector:main"
opencode-comms = "agent_comms.cli_bridges.opencode_launch:main"
claude-comms = "agent_comms.cli_bridges.claude_launch:main"

[project.entry-points."agent_comms.writer_owned_stores"]
bridge-delivery = "agent_comms.cli_bridges.shared"
connector-credentials = "agent_comms.transport.connector_store"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
require-runtime-dependencies = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_comms", "src/agent_comms_hooks"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "agent_comms/_native/AGENTS.md"
"stack/pi-native.sha256" = "agent_comms/_native/pi-native.sha256"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "extensions", "README.md", "LICENSE", "hatch_build.py",
    "AGENTS.md", "stack/AGENTS.md",
    "stack/pi-native.sha256",
]

[tool.hatch.version]
path = "src/agent_comms/__init__.py"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tools"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# A hung test fails by name instead of holding the whole job.
timeout = 60
# A test blocked inside a C call (SQLite, flock) never runs a SIGALRM handler, so the signal
# method never fires; the thread method dumps every stack and ends the worker, and xdist
# replaces it and runs the rest of its queue.
timeout_method = "thread"
# An interpreter missing a plugin refuses to start instead of silently ignoring `timeout`.
required_plugins = ["pytest-timeout>=2.3", "pytest-xdist>=3.6", "pytest-asyncio>=0.23"]
markers = ["refactor_guard: permanent architecture guards selected by the required debt check"]
# A test that builds a coroutine and drops it never ran the setup it names, and the only
# notice is a warning printed beside the failure it caused. Fail on the warning instead.
filterwarnings = ["error:coroutine .* was never awaited:RuntimeWarning"]
# /tmp is RAM: keep only the last run's failing tests' directories.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "agent_comms.storage.store_files.ExclusiveLock",
    "agent_comms.execution.imported_messages.ImportLimits",
    "agent_comms.execution.transcript_sources.LatestPage",
    "agent_comms.execution.transcript_sources.AtFrontier",
    "agent_comms.transcript.transcripts.LivePageSource",
    "agent_comms.messaging.notification_evidence.FirstRecipient",
    "agent_comms.messaging.notification_evidence.RecipientLimit",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["xdist.*"]
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-comms"
dynamic = ["version"]
description = "Declaration-owned multi-agent coordination for OpenHCS: threads, JSONL message bus, shared ledger, and ACP server"
authors = [{ name = "Tristan Simas", email = "tristan.simas@mail.mcgill.ca" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
keywords = ["agents", "coordination", "message-bus", "acp", "multi-agent"]

dependencies = [
    "metaclass-registry>=0.1.0",
    "nominal-refactor-audit @ git+https://github.com/OpenHCSDev/NominalRefactorAdvisor.git@9a98d72e10cd7ebae688b2e70d096f0ddc9a4c10#subdirectory=skills/refactor-audit",
]

[project.optional-dependencies]
acp = [
    "agent-client-protocol>=0.8",
]
all = [
    "agent-client-protocol>=0.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "black==26.5.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "agent-client-protocol>=0.8",
]

[project.urls]
Homepage = "https://github.com/OpenHCSDev/agent-comms"
Repository = "https://github.com/OpenHCSDev/agent-comms"
Issues = "https://github.com/OpenHCSDev/agent-comms/issues"

[project.scripts]
agent-comms-ratchet = "agent_comms.debt_ratchet:main"
agent-comms = "agent_comms.cli:main"
agent-comms-acp = "agent_comms.acp:main"
agent-comms-agent = "agent_comms.worker:main"
agent-comms-nk-foreground = "agent_comms.nk_foreground:main"
pi-comms-native = "agent_comms.native_pi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_comms"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
".pi/APPEND_SYSTEM.md" = "agent_comms/_native/APPEND_SYSTEM.md"
"stack/pi-native.sha256" = "agent_comms/_native/pi-native.sha256"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "extensions", "README.md", "LICENSE",
    ".pi/APPEND_SYSTEM.md", "stack/APPEND_SYSTEM.md",
    "stack/pi-native.sha256",
]

[tool.hatch.version]
path = "src/agent_comms/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-n auto --maxprocesses=8 --dist=worksteal --cov=agent_comms --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
markers = ["refactor_guard: permanent architecture guards selected by the required debt check"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

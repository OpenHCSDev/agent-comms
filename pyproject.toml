[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-comms"
dynamic = ["version"]
description = "Declaration-owned multi-agent coordination for OpenHCS: threads, JSONL message bus, shared ledger, and ACP server"
authors = [{ name = "Tristan Simas", email = "tristan.simas@mail.mcgill.ca" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
keywords = ["agents", "coordination", "message-bus", "acp", "multi-agent"]

dependencies = []

[project.optional-dependencies]
acp = [
    "agent-client-protocol>=0.8",
]
all = [
    "agent-client-protocol>=0.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "black==26.5.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "agent-client-protocol>=0.8",
]

[project.urls]
Homepage = "https://github.com/OpenHCSDev/agent-comms"
Repository = "https://github.com/OpenHCSDev/agent-comms"
Issues = "https://github.com/OpenHCSDev/agent-comms/issues"

[project.scripts]
agent-comms = "agent_comms.cli:main"
agent-comms-acp = "agent_comms.acp:main"
agent-comms-agent = "agent_comms.agent_loop:main"
agent-comms-nk-foreground = "agent_comms.nk_foreground:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_comms"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "extensions", "README.md", "LICENSE"]

[tool.hatch.version]
path = "src/agent_comms/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-n auto --maxprocesses=8 --dist=worksteal --cov=agent_comms --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
